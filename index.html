<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuemaster Elite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb, rgba(0,0,0,0.12)); border-radius: 100px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover, rgba(0,0,0,0.22)); }
      ::-webkit-scrollbar-button { display: none !important; height: 0 !important; width: 0 !important; }
      ::-webkit-scrollbar-corner { background: transparent; }
      html, body, div, aside, nav, main, section, ul { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb, rgba(0,0,0,0.12)) transparent; }
    </style>
  </head>
  <body>
    <script>
      (function(){try{var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.classList.add('dark')}}catch(e){}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
